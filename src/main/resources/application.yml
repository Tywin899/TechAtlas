spring:
  application:
    name: techatlas
  profiles:
    active: local

server:
  port: 8080

logging:
  level:
    root: INFO
    com.techatlas: INFO
    org.springframework: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha

wikipedia:
  base-url: https://en.wikipedia.org/api/rest_v1
  timeout: 5000

index:
  stopwords:
    - a
    - an
    - the
    - of
    - is
    - are
    - was
    - were
    - to
    - for
    - and
    - or
    - with
  stemming: true
  normalization: true

search:
  bm25:
    k1: 1.2
    b: 0.75
  pagination:
    default-size: 10
    max-size: 100

github:
  api-url: https://api.github.com
  token: ${GITHUB_TOKEN:}
  timeout: 5000

stackoverflow:
  api-url: https://api.stackexchange.com/2.3
  site: stackoverflow
  timeout: 5000
  default-page-size: 30
  max-page-size: 100
  max-answers-per-question: 1
  api-key: ${STACKOVERFLOW_API_KEY:}

sync:
  scheduler:
    enabled: true
    fixed-delay-ms: 21600000
    initial-delay-ms: 30000
    wikipedia:
      enabled: true
    github:
      enabled: true
    stackoverflow:
      enabled: true

cache:
  redis:
    enabled: true
    host: localhost
    port: 6379
    search:
      ttl-seconds: 300
    document:
      ttl-seconds: 600

autocomplete:
  enabled: true
  default-limit: 10
  max-limit: 20
  max-prefix-length: 50
  popular-query:
    enabled: true
    max-size: 1000
  recent-query:
    enabled: true
    max-size: 10

analytics:
  enabled: true
  default-limit: 10
  max-limit: 100



