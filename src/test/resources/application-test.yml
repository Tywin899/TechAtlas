spring:
  datasource:
    url: jdbc:h2:mem:techatlas_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

  flyway:
    enabled: false

sync:
  scheduler:
    enabled: false

cache:
  redis:
    enabled: false

autocomplete:
  enabled: true
  default-limit: 5
  max-limit: 10
  max-prefix-length: 50
  popular-query:
    enabled: true
    max-size: 5
  recent-query:
    enabled: true
    max-size: 5

analytics:
  enabled: true
  default-limit: 5
  max-limit: 10



